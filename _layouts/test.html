
<body class="{{ page.class }}"></body>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/iresume.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/metro-parallax.css' | relative_url }}">
    <style>
        body {
            max-width: 100%;
            margin: 0 auto;
            padding: 0 20px;
        }

        .metro-header {
            font-size: clamp(24px, 5vw, 48px);
            text-align: center;
            padding: 20px 0;
        }

        .metro-subhead {
            font-size: clamp(16px, 3vw, 24px);
        }

        .metro-map-vertical {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .metro-stop-row {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 10px;
        }

        .metro-details {
            flex: 1;
        }

        @media (max-width: 768px) {
            .metro-stop-row {
                flex-direction: column;
                text-align: center;
            }

            .metro-details h3 {
                font-size: clamp(18px, 4vw, 24px);
            }

            .metro-details h4 {
                font-size: clamp(16px, 3vw, 20px);
            }

            .metro-details p {
                font-size: clamp(14px, 2.5vw, 16px);
            }
        }

        .resume-section {
            width: 100%;
            max-width: 1200px;
            margin: 20px auto;
        }

        .toggle-btn {
            width: 100%;
            padding: 15px;
            font-size: clamp(16px, 3vw, 20px);
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }

        .toggle-content {
            padding: 15px;
            font-size: clamp(14px, 2.5vw, 16px);
        }
    </style>
</head>

<!-- Script for Button Functionality -->
<script>
    function toggleContent(id) {
      const content = document.getElementById(id);
      content.style.display = content.style.display === 'block' ? 'none' : 'block';
    }
</script>

<!-- Script for Scroll Observing: Capture User's Scroll Activity -->

<!-- Animating Metro Stops --->

<script>
  function animateMetroStopsWithProgress() {
    const metroMaps = document.querySelectorAll('.metro-map-vertical');
    
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const stop = entry.target.querySelector('.metro-stop');
          const details = entry.target.querySelector('.metro-details');
          
          stop.classList.add('active');
          if (details) {
            details.classList.add('active');
          }
        }
      });
    }, {
      threshold: 0.2, // Trigger when 20% of the element is visible
      rootMargin: '0px 0px -10% 0px' // Slightly adjust the trigger area
    });

    // Observe each stop-row instead of the entire map
    metroMaps.forEach(map => {
      const stopRows = map.querySelectorAll('.metro-stop-row');
      stopRows.forEach(row => observer.observe(row));
    });
  }

  // Initialize on load
  document.addEventListener('DOMContentLoaded', animateMetroStopsWithProgress);
  
  // Reset animations on page refresh
  window.addEventListener('beforeunload', () => {
    document.querySelectorAll('.metro-stop, .metro-details').forEach(el => {
      el.classList.remove('active');
    });
  });
</script>
  

{{ content }}
