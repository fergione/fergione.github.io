
<body class="{{ page.class }}"></body>
<head>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/iresume.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/metro-parallax.css' | relative_url }}">
</head>

<!-- Script for Button Functionality -->
<script>
    function toggleContent(id) {
      const content = document.getElementById(id);
      content.style.display = content.style.display === 'block' ? 'none' : 'block';
    }
</script>

<!-- Script for Scroll Observing: Capture User's Scroll Activity -->

<!-- Animating Metro Stops --->

<script>
  function animateMetroStopsWithProgress() {
    const metroMaps = document.querySelectorAll('.metro-map-vertical');

    metroMaps.forEach(map => {
      const stopRows = map.querySelectorAll('.metro-stop-row');
      const mapTop = map.getBoundingClientRect().top;
      const mapHeight = map.offsetHeight;
      const windowHeight = window.innerHeight;

      // How far the user has scrolled *through* this section (0 to 1)
      const scrollProgress = Math.min(
        Math.max((windowHeight - mapTop) / (windowHeight + mapHeight), 0),
        1
      );

      stopRows.forEach((row, index) => {
        const stop = row.querySelector('.metro-stop');
        const revealPoint = index / stopRows.length; // how far down this stop is

        if (scrollProgress > revealPoint) {
          stop.classList.add('active');
        } else {
          stop.classList.remove('active');
        }
      });
    });
  }

  window.addEventListener('scroll', animateMetroStopsWithProgress);
  window.addEventListener('load', animateMetroStopsWithProgress);
</script>
  

{{ content }}
