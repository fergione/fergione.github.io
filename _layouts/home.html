<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <style>
        /* Loading Screen */
        .loader-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 1;
            transition: opacity 1s ease-out;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Main Content */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', sans-serif;
            overflow-x: hidden;
        }

        /* Video Background */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0;
            transition: opacity 1s ease-in;
            background: #000; /* Fallback color */
        }

        .video-background video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Link Blocks Container */
        .blocks-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            padding: 2rem;
            margin-top: 100px;
        }

        /* Individual Link Blocks */
        .link-block {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 2rem;
            color: white;
            text-decoration: none;
            transform: translateY(50px);
            opacity: 0;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
        }

        .link-block:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .link-block h2 {
            margin: 0 0 1rem 0;
            font-size: 1.5rem;
        }

        .link-block p {
            margin: 0;
            font-size: 1rem;
            opacity: 0.8;
        }

        /* Animation Classes */
        .fade-in {
            opacity: 1 !important;
        }

        .slide-up {
            transform: translateY(0) !important;
            opacity: 1 !important;
        }

        /* Updated Contact Popup Styles */
        .contact-popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            max-width: 500px;
            width: 90%;
        }

        .contact-popup h3 {
            color: #231f20;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            text-align: center;
        }

        .contact-popup form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .contact-popup input,
        .contact-popup textarea {
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: inherit;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .contact-popup input:focus,
        .contact-popup textarea:focus {
            outline: none;
            border-color: #231f20;
        }

        .contact-popup textarea {
            min-height: 120px;
            resize: vertical;
        }

        .contact-popup button[type="submit"] {
            background: #231f20;
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: background-color 0.3s ease;
            margin-top: 0.5rem;
        }

        .contact-popup button[type="submit"]:hover {
            background: #3a3536;
        }

        .popup-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            backdrop-filter: blur(3px);
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #231f20;
            transition: color 0.3s ease;
            padding: 0.5rem;
            line-height: 1;
        }

        .close-btn:hover {
            color: #3a3536;
        }

        .popup-note {
            color: #666;
            font-size: 0.9rem;
            margin-top: 1rem;
            text-align: center;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .contact-popup {
                padding: 2rem;
                width: 85%;
            }

            .contact-popup h3 {
                font-size: 1.3rem;
            }
        }

        /* Ensure link-block stays above video background */
        .blocks-container {
            position: relative;
            z-index: 2;
        }

        .video-background {
            z-index: 1;
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loader-wrapper">
        <div class="loader"></div>
    </div>

    <!-- Video Background -->
    <div class="video-background">
        <video autoplay muted loop playsinline preload="auto">
            <source src="{{ '/assets/videos/background_wo.mp4' | relative_url }}" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <!-- Link Blocks -->
    <div class="blocks-container">
        <a href="/resume" class="link-block">
            <h2>Interactive Resume</h2>
            <p>Explore my career journey through an interactive metro map experience</p>
        </a>
        <a href="/projects" class="link-block">
            <h2>Projects</h2>
            <p>Discover the various projects I've worked on</p>
        </a>
        <a href="/blog" class="link-block">
            <h2>Blog</h2>
            <p>Read my thoughts on technology and development</p>
        </a>
        <div class="link-block yellow" onclick="openContactPopup()">
            <h2>Contact</h2>
            <p>Get in touch with me</p>
        </div>
    </div>

    <!-- Contact Popup -->
    <div class="popup-overlay" id="overlay"></div>
    <div class="contact-popup" id="contactPopup" role="dialog" aria-labelledby="contactTitle">
        <button class="close-btn" onclick="closeContactPopup()" aria-label="Close popup">&times;</button>
        <h3 id="contactTitle">Send a Message</h3>
        <form id="contactForm" onsubmit="submitContactForm(event)">
            <input type="text" placeholder="Your Name" required aria-label="Your Name">
            <input type="email" placeholder="Your Email" required aria-label="Your Email">
            <textarea placeholder="Your Message" required aria-label="Your Message"></textarea>
            <button type="submit">Send Message</button>
        </form>
        <p class="popup-note">Your message will be sent to michael@fergione.com</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.querySelector('video');
            const videoBackground = document.querySelector('.video-background');
            const loader = document.querySelector('.loader-wrapper');
            const blocks = document.querySelectorAll('.link-block');

            // Add error handling for video
            video.addEventListener('error', (e) => {
                console.error('Error loading video:', e);
                console.error('Video error details:', video.error);
                // Start animations anyway if video fails
                startAnimations();
            });

            // Log video loading status
            video.addEventListener('loadeddata', () => {
                console.log('Video loaded successfully');
            });

            // Function to start animations
            function startAnimations() {
                // Fade out loader
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.display = 'none';
                }, 1000);

                // Ensure video is visible and playing
                video.style.display = 'block';
                videoBackground.classList.add('fade-in');
                video.play().catch(e => console.error('Error playing video:', e));

                // Animate blocks with delay
                blocks.forEach((block, index) => {
                    setTimeout(() => {
                        block.classList.add('slide-up');
                    }, 1000 + (index * 200));
                });
            }

            // Start animations when video is ready
            if (video.readyState >= 3) {
                console.log('Video ready state:', video.readyState);
                startAnimations();
            } else {
                video.addEventListener('canplay', () => {
                    console.log('Video can play');
                    startAnimations();
                });
            }

            // Fallback if video takes too long
            setTimeout(() => {
                if (!videoBackground.classList.contains('fade-in')) {
                    console.log('Fallback timeout triggered');
                    startAnimations();
                }
            }, 3000);
        });

        // Contact popup functions
        function openContactPopup() {
            document.getElementById('contactPopup').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        }

        function closeContactPopup() {
            document.getElementById('contactPopup').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        }

        function submitContactForm(event) {
            event.preventDefault();
            const form = event.target;
            const name = form.querySelector('input[type="text"]').value;
            const email = form.querySelector('input[type="email"]').value;
            const message = form.querySelector('textarea').value;
            
            // Construct mailto URL with form data
            const mailtoUrl = `mailto:michael@fergione.com?subject=Contact from ${name}&body=${encodeURIComponent(message)}\n\nFrom: ${email}`;
            
            // Open default email client
            window.location.href = mailtoUrl;
            
            // Close popup
            closeContactPopup();
            
            // Reset form
            form.reset();
        }

        // Close popup when clicking overlay
        document.getElementById('overlay').addEventListener('click', closeContactPopup);
    </script>
</body>
</html>
